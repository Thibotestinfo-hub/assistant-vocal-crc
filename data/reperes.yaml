# Repères connus par commune, pour la recherche d'itinéraire (outil
# calculer_itineraire) : permet de résoudre une destination comme
# "la mairie" vers l'arrêt le plus proche, sans géocodage ouvert.
#
# Écrit à la main, coordonnées vérifiées une par une via l'API Adresse
# du gouvernement (api-adresse.data.gouv.fr, Base Adresse Nationale),
# le 25/09/2026 — jamais estimées. Piège rencontré et corrigé pendant la
# collecte : une recherche par nom de commune seul peut tomber sur un
# homonyme d'un autre département (ex. "Vitrolles" en Bouches-du-Rhône
# vs "Vitrolles-en-Luberon" dans le Vaucluse) — toujours vérifier que le
# code postal commence par 13 pour ce périmètre.
#
# v0 : uniquement les mairies des 8 communes du réseau. À étoffer
# (gares, écoles, hôpitaux...) une fois ce premier jet éprouvé en test.

