# Paramètres propres au réseau "Les bus de l'étang" (mamp-bde).
# Voir CLAUDE.md : dupliquer l'agent sur un autre réseau doit être une
# opération de paramétrage, pas de développement.

# L'apiKey Mecatran est un secret : elle vit dans MECATRAN_API_KEY (.env,
# jamais ici), comme ELEVENLABS_API_KEY ou TWILIO_AUTH_TOKEN ci-dessous.
gtfs_url_base: "https://app.mecatran.com/utw/ws/gtfsfeed/static/mamp-bde"

# Site public du réseau — c'est aussi la source scrapée par
# assistant/ingestion/extraire_corpus.py (BASE_URL) pour la base de
# connaissance. Vérifié le 02/09/2026 : correspond bien au réseau de
# bus de la zone Étang (mêmes communes : Vitrolles, Rognac...).
site_web: "https://www.salonetangcotebleue.fr/"

# Identifiant de l'agent ElevenLabs de ce réseau (pas un secret, juste
# une référence — la clé pour agir dessus est ELEVENLABS_API_KEY, dans
# .env, jamais ici).
elevenlabs_agent_id: "agent_7101m00afyqfe16re00h46qnbnd3"

# Numéro Twilio depuis lequel les SMS (itinéraire complexe) sont envoyés
# — pas un secret, juste une référence. Les identifiants pour agir
# dessus (TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN) sont dans .env, jamais
# ici (voir assistant/outils/sms.py).
twilio_numero_envoi: "+33939205690"

# Horaires d'ouverture du CRC (Salon-de-Provence) — communiqués par
# l'utilisatrice le 30/10/2026. Fermé le dimanche et les jours fériés
# français (calculés, voir assistant/outils/horaires_crc.py — jamais une
# liste figée à mettre à jour chaque année). Deux saisons, bornes
# incluses, résolues par date (mois-jour) indépendamment de l'année.
horaires_crc:
  jours_fermes_semaine: ["dimanche"]
  saisons:
    - debut: "04-01"
      fin: "09-30"
      ouverture: "08:30"
      fermeture: "18:00"
    - debut: "10-01"
      fin: "03-31"
      ouverture: "08:30"
      fermeture: "17:30"

